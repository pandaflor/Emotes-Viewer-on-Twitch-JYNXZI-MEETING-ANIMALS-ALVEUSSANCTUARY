<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch chat replay (Maya)</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f5f5f7;
    --bg-bar: #ffffff;
    --text: #0e0e10;
    --muted: #6b6b76;
    --line: #e2e2e8;
    --accent: #772ce8;
    --accent-text: #ffffff;
    --mark: #ffe58a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --bg-alt: #1f1f23;
      --bg-bar: #18181b;
      --text: #efeff1;
      --muted: #9a9aa6;
      --line: #2f2f35;
      --accent: #a970ff;
      --accent-text: #18181b;
      --mark: #5c4a00;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 4rem; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header { padding: 1.25rem 1.25rem 0.75rem; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }

  .bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center;
    padding: 0.6rem 1.25rem;
    background: var(--bg-bar);
    border-bottom: 1px solid var(--line);
  }
  .bar input[type=search] {
    flex: 1 1 16rem; min-width: 0; max-width: 28rem;
    padding: 0.45rem 0.7rem; font: inherit;
    color: var(--text); background: var(--bg-alt);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .bar label { color: var(--muted); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem; }
  .bar select {
    font: inherit; color: var(--text); background: var(--bg-alt);
    border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.4rem;
  }
  .pager { margin-left: auto; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }
  .pager .info { color: var(--muted); font-variant-numeric: tabular-nums; }
  button {
    font: inherit; padding: 0.4rem 0.8rem; cursor: pointer;
    color: var(--text); background: var(--bg-alt);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 34rem; }
  th, td { padding: 0.35rem 0.75rem; text-align: left; vertical-align: middle; }
  th {
    position: sticky; top: 0; font-weight: 600; font-size: 0.85rem; color: var(--muted);
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  col.t { width: 5.5rem; }
  col.a { width: 15rem; }
  tbody tr:nth-child(even) { background: var(--bg-alt); }
  td.t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.a { font-weight: 600; overflow-wrap: anywhere; }
  td.m { overflow-wrap: anywhere; white-space: pre-wrap; }
  td img { height: 20px; width: auto; vertical-align: middle; margin: 0 1px; }
  td.a img { margin-left: 4px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .empty { padding: 2.5rem 1.25rem; color: var(--muted); }
  @media (max-width: 640px) {
    col.a { width: 9rem; }
    header, .bar { padding-left: 0.75rem; padding-right: 0.75rem; }
    th, td { padding-left: 0.5rem; padding-right: 0.5rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Twitch chat replay (Maya)</h1>
  <p>16,573 messages over 2 h 2 min. Badges and emotes load from their original sources, so you need to be online to see them.</p>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Search author or message" aria-label="Search author or message" autocomplete="off">
  <label>Rows per page
    <select id="size">
      <option>100</option><option selected>200</option><option>500</option><option>1000</option>
    </select>
  </label>
  <div class="pager">
    <button id="prev" type="button">Previous</button>
    <span class="info" id="info" aria-live="polite"></span>
    <button id="next" type="button">Next</button>
  </div>
</div>

<div class="wrap">
  <table>
    <colgroup><col class="t"><col class="a"><col></colgroup>
    <thead><tr><th>Time</th><th>Author</th><th>Message</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No messages match that search.</div>
</div>

<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var URLS = D.urls, ROWS = D.rows;
  var TOKEN = /\ue000(\d+)\ue001/g;

  // Plain, lowercase text per row for searching (image tokens removed)
  var PLAIN = ROWS.map(function (r) {
    return (r[1] + ' ' + r[2]).replace(TOKEN, '').toLowerCase();
  });

  var body = document.getElementById('body');
  var info = document.getElementById('info');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var qEl = document.getElementById('q');
  var sizeEl = document.getElementById('size');
  var emptyEl = document.getElementById('empty');

  var matches = ROWS.map(function (_, i) { return i; });
  var page = 0, term = '';

  function addText(parent, text) {
    if (!text) return;
    if (term) {
      var lower = text.toLowerCase(), pos = 0, idx;
      while ((idx = lower.indexOf(term, pos)) !== -1) {
        if (idx > pos) parent.appendChild(document.createTextNode(text.slice(pos, idx)));
        var m = document.createElement('mark');
        m.textContent = text.slice(idx, idx + term.length);
        parent.appendChild(m);
        pos = idx + term.length;
      }
      if (pos < text.length) parent.appendChild(document.createTextNode(text.slice(pos)));
    } else {
      parent.appendChild(document.createTextNode(text));
    }
  }

  // Text goes in as text nodes, images as <img> elements, so nothing is parsed as HTML
  function fill(td, str) {
    var last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(str)) !== null) {
      addText(td, str.slice(last, m.index));
      var img = document.createElement('img');
      img.src = URLS[+m[1]];
      img.loading = 'lazy';
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      td.appendChild(img);
      last = TOKEN.lastIndex;
    }
    addText(td, str.slice(last));
  }

  function render() {
    var size = +sizeEl.value;
    var pages = Math.max(1, Math.ceil(matches.length / size));
    if (page >= pages) page = pages - 1;
    var start = page * size, end = Math.min(start + size, matches.length);

    var frag = document.createDocumentFragment();
    for (var i = start; i < end; i++) {
      var r = ROWS[matches[i]];
      var tr = document.createElement('tr');
      var t = document.createElement('td'); t.className = 't'; t.textContent = r[0];
      var a = document.createElement('td'); a.className = 'a'; fill(a, r[1]);
      var m = document.createElement('td'); m.className = 'm'; fill(m, r[2]);
      tr.appendChild(t); tr.appendChild(a); tr.appendChild(m);
      frag.appendChild(tr);
    }
    body.replaceChildren(frag);

    emptyEl.hidden = matches.length > 0;
    info.textContent = matches.length
      ? 'Page ' + (page + 1).toLocaleString() + ' of ' + pages.toLocaleString() +
        ' (' + matches.length.toLocaleString() + (term ? ' matches)' : ' messages)')
      : '0 matches';
    prev.disabled = page === 0;
    next.disabled = page >= pages - 1;
  }

  function applyFilter() {
    term = qEl.value.trim().toLowerCase();
    if (!term) {
      matches = ROWS.map(function (_, i) { return i; });
    } else {
      matches = [];
      for (var i = 0; i < PLAIN.length; i++) if (PLAIN[i].indexOf(term) !== -1) matches.push(i);
    }
    page = 0;
    render();
  }

  var timer;
  qEl.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(applyFilter, 200); });
  sizeEl.addEventListener('change', function () { page = 0; render(); window.scrollTo(0, 0); });
  prev.addEventListener('click', function () { page--; render(); window.scrollTo(0, 0); });
  next.addEventListener('click', function () { page++; render(); window.scrollTo(0, 0); });

  render();
})();
</script>
